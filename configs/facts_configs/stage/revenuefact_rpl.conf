spark.renuefactquery  SELECT CURRENT_TIMESTAMP() AS snapshot_date ,COALESCE(rd.res_id, - 1) AS res_id ,COALESCE(gm.guest_id, - 1) AS guest_id ,COALESCE(CASE WHEN pm.package_id IS NULL THEN CASE WHEN shorex_pm.package_id IS NULL THEN pm_pkg.package_id ELSE shorex_pm.package_id END ELSE pm.package_id END, - 1) AS package_id ,cast(COALESCE(invitm.invoice_item_type_id, - 1) AS integer) invoice_item_type_id ,cast(COALESCE(lkparea.price_area_id, - 1) AS integer) price_area_id ,COALESCE(sh.ship_id, - 1) AS ship_id ,COALESCE(am.agent_id, - 1) AS agent_id ,COALESCE(agency.agency_id, - 1) AS agency_id ,cast(CASE WHEN LENGTH(inv.promo_code) = 0 THEN - 1 ELSE COALESCE(pro_lkp.promotion_id, - 1) END AS integer) promotion_id ,cAst(COALESCE(addon_id, - 1) AS integer) addon_id ,- 1 AS cardeck_id ,- 1 AS shorex_id ,COALESCE(hd.hotel_res_req_id, - 1) AS hotel_res_req_id ,- 1 AS ship_room_req_id ,COALESCE(CASE WHEN sail.sail_id IS NULL THEN sail_pkg.sail_id ELSE sail.sail_id END, - 1) AS sail_id ,COALESCE((ROUND(inv.amount, 2)), 0) AS amount ,COALESCE((ROUND(inv.commission_percent, 2)), 0) AS commission_percent ,CASE WHEN gm.guest_seqn = 1 OR gm.guest_seqn IS NULL THEN COALESCE(reshdr.net_due, - 1) ELSE 0 END AS net_due ,cast(NULL AS DOUBLE) AS addon_qty ,COALESCE(reshdr.currency, 'USD') AS currency ,COALESCE(reshdr.currency_rate, 0) AS currency_rate ,- 1 COUPON_CLASS_ID FROM ( SELECT MAX(dwh.load_date) AS load_date ,MAX(dwh.entity_id) AS entity_id ,entity_origin_id FROM vv_db.hvtb_nbx_landing_sw_dwh_extract_load dwh JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_header hdr ON dwh.ENTITY_ID = hdr.REC_RES_ID WHERE dwh.entity_type = 'RES' AND hdr.RES_STATUS <> 'CX' GROUP BY entity_origin_id ) el JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_invoice inv ON inv.rec_res_id = el.entity_id LEFT JOIN vv_db_temp.hvtb_nbx_core_sw_reservation_dim rd ON el.entity_origin_id = rd.src_res_id AND TO_DATE(rd.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_guest rg ON inv.rec_guest_id = rg.rec_guest_id LEFT JOIN vv_db_temp.hvtb_nbx_core_sw_guest_dim gm ON rg.guest_id = gm.src_guest_id AND TO_DATE(gm.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_package rp ON inv.rec_pkg_id = rp.rec_pkg_id LEFT JOIN vv_db.hvtb_nbx_core_sw_package_dim pm ON rp.package_id = pm.src_package_id AND TO_DATE(pm.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_invoice_item_type_lkp invitm ON inv.invoice_item_type = invitm.invoice_item_type AND ( CASE WHEN LENGTH(inv.invoice_item_subtype) = 0 OR inv.invoice_item_subtype IS NULL THEN '-1' ELSE inv.invoice_item_subtype END ) = COALESCE(invitm.invoice_item_subtype, '-1') LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_price_area_lkp lkparea ON inv.price_area = lkparea.price_area LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_header reshdr ON inv.rec_res_id = reshdr.rec_res_id LEFT JOIN vv_db.hvtb_nbx_core_sw_ship_dim sh ON reshdr.ship = sh.ship LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_agency_dim Agency ON reshdr.agency_id = Agency.src_agency_id AND TO_DATE(Agency.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_sail_dim sail ON rp.sail_id = sail.src_sail_id AND TO_DATE(sail.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_addon addon ON inv.rec_addon_id = addon.rec_addon_id LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_addon_lkp al ON NVL(addon.res_addon_code, '~') = NVL(al.res_addon_code, '~') AND NVL(addon.addon_category, '~') = NVL(al.addon_category, '~') AND NVL(addon.addon_type, '~') = NVL(al.addon_type, '~') AND encode(NVL(addon.addon_name, '~'), 'utf-8') = encode(NVL(al.addon_name, '~'), 'utf-8') LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_promotion pro ON inv.rec_res_id = pro.rec_res_id AND inv.rec_guest_id = pro.rec_guest_id AND inv.rec_pkg_id = pro.rec_pkg_id AND NVL(inv.promo_code, '~') = NVL(pro.promo_code, '~') LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_promotion_lkp pro_lkp ON NVL(pro.promo_group, '~') = NVL(pro_lkp.promo_group, '~') AND NVL(pro.promo_code, '~') = NVL(pro_lkp.promo_code, '~') AND NVL(pro.promo_name, '~') = NVL(pro_lkp.promo_name, '~') LEFT JOIN vv_db.hvtb_nbx_core_crm_agent_master_dim am ON reshdr.agent_id = am.seaware_agent_id__c AND TO_DATE(am.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_shorex shorex ON inv.rec_shorex_id = shorex.rec_shorex_id LEFT JOIN vv_db.hvtb_nbx_core_sw_package_dim shorex_pm ON shorex.PACKAGE_ID = shorex_pm.src_package_id AND TO_DATE(shorex_pm.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_hotel ht ON inv.rec_hotel_id = ht.rec_hotel_id LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_hotel_res_req_dim hd ON reshdr.res_id = hd.src_res_id AND rg.guest_id = hd.src_guest_id AND ht.request_type = hd.request_type AND ht.room_seq_number = hd.room_seq_number LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_package rp_pkg ON reshdr.rec_res_id = rp_pkg.rec_res_id AND rp_pkg.rec_guest_id = rg.rec_guest_id AND rp_pkg.package_class = 'VOYAGE' LEFT JOIN vv_db.hvtb_nbx_core_sw_package_dim pm_pkg ON rp_pkg.package_id = pm_pkg.src_package_id AND TO_DATE(pm_pkg.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_sail_dim sail_pkg ON rp_pkg.sail_id = sail_pkg.src_sail_id AND TO_DATE(sail_pkg.rec_end_dttm) = '9999-12-31' WHERE reshdr.ship <> 'XE' AND lkparea.price_area NOT IN ( 'SHIPROOM' ,'COUPON' )  UNION ALL  SELECT CURRENT_TIMESTAMP() AS snapshot_date ,COALESCE(rd.res_id, - 1) AS res_id ,COALESCE(gm.guest_id, - 1) AS guest_id ,COALESCE(CASE WHEN pm.package_id IS NULL THEN pm_pkg.package_id ELSE pm.package_id END, - 1) AS package_id ,cast(COALESCE(invitm.invoice_item_type_id, - 1) AS integer) invoice_item_type_id ,cast(COALESCE(lkparea.price_area_id, - 1) AS integer) price_area_id ,COALESCE(sh.ship_id, - 1) AS ship_id ,COALESCE(am.agent_id, - 1) AS agent_id ,COALESCE(agency.agency_id, - 1) AS agency_id ,cast(CASE WHEN LENGTH(pro_lkp.promo_code) = 0 THEN - 1 ELSE COALESCE(pro_lkp.promotion_id, - 1) END AS integer) promotion_id ,cast(- 1 AS integer) addon_id ,- 1 AS cardeck_id ,- 1 AS shorex_id ,- 1 AS hotel_res_req_id ,COALESCE(sr.ship_room_req_id, - 1) AS ship_room_req_id ,COALESCE(sd.sail_id, - 1) AS sail_id ,COALESCE((ROUND(inv.amount, 2)), 0) AS amount ,COALESCE((ROUND(inv.commission_percent, 2)), 0) AS commission_percent ,CASE WHEN gm.guest_seqn = 1 OR gm.guest_seqn IS NULL THEN COALESCE(reshdr.net_due, - 1) ELSE 0 END AS net_due ,cast(NULL AS DOUBLE) AS addon_qty ,COALESCE(reshdr.currency, 'USD') AS currency ,COALESCE(reshdr.currency_rate, 0) AS currency_rate ,COALESCE(ccd.COUPON_CLASS_ID, - 1) COUPON_CLASS_ID FROM vv_db.hvtb_nbx_landing_sw_rpl_res_invoice_item inv JOIN vv_db.hvtb_nbx_landing_sw_rpl_res_package rp ON inv.res_package_id = rp.res_package_id AND inv.price_area IN ( 'SHIPROOM' ,'COUPON' ) LEFT JOIN ( SELECT MAX(dwh.load_date) AS load_date ,MAX(dwh.entity_id) AS entity_id ,entity_origin_id FROM vv_db.hvtb_nbx_landing_sw_dwh_extract_load dwh JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_header hdr ON dwh.ENTITY_ID = hdr.REC_RES_ID WHERE dwh.entity_type = 'RES' AND hdr.RES_STATUS <> 'CX' GROUP BY entity_origin_id ) el ON inv.res_id = el.entity_origin_id LEFT JOIN vv_db_temp.hvtb_nbx_core_sw_reservation_dim rd ON inv.res_id = rd.src_res_id AND TO_DATE(rd.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db_temp.hvtb_nbx_core_sw_guest_dim gm ON inv.guest_id = gm.src_guest_id AND TO_DATE(gm.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db.hvtb_nbx_core_sw_package_dim pm ON rp.package_id = pm.src_package_id AND TO_DATE(pm.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_invoice_item_type_lkp invitm ON inv.invoice_item_type = invitm.invoice_item_type AND ( CASE WHEN LENGTH(inv.invoice_item_subtype) = 0 OR inv.invoice_item_subtype IS NULL THEN '-1' ELSE inv.invoice_item_subtype END ) = COALESCE(invitm.invoice_item_subtype, '-1') LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_price_area_lkp lkparea ON inv.price_area = lkparea.price_area LEFT JOIN vv_db.hvtb_nbx_landing_sw_dwh_res_header reshdr ON el.entity_id = reshdr.rec_res_id LEFT JOIN vv_db.hvtb_nbx_core_sw_ship_dim sh ON reshdr.ship = sh.ship LEFT JOIN vv_db.hvtb_nbx_landing_sw_rpl_res_package rp_pkg ON inv.res_id = rp_pkg.res_id AND rp_pkg.guest_id = inv.guest_id AND rp_pkg.package_class = 'VOYAGE' LEFT JOIN vv_db.hvtb_nbx_core_sw_package_dim pm_pkg ON rp_pkg.package_id = pm_pkg.src_package_id AND TO_DATE(pm_pkg.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_agency_dim Agency ON reshdr.agency_id = Agency.src_agency_id AND TO_DATE(Agency.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db.hvtb_nbx_landing_sw_rpl_pap_master pap ON pap.pap_code = inv.price_program LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_promotion_lkp pro_lkp ON NVL(pap.promo_group, '~') = NVL(pro_lkp.promo_group, '~') AND NVL(pap.pap_code, '~') = NVL(pro_lkp.promo_code, '~') AND NVL(pap.pap_name, '~') = NVL(pro_lkp.promo_name, '~') LEFT JOIN vv_db.hvtb_nbx_core_crm_agent_master_dim am ON reshdr.agent_id = am.seaware_agent_id__c AND TO_DATE(am.rec_end_dttm) = '9999-12-31' LEFT JOIN vv_db.hvtb_nbx_core_sw_ship_room_request_dim sr ON rp.shiproom_request_id = sr.src_request_id LEFT JOIN vv_db_mig.hvtb_nbx_core_sw_sail_dim sd ON sd.src_sail_id = rd.src_sail_id AND sd.rec_end_dttm LIKE '999%' LEFT JOIN vv_db.hvtb_nbx_core_sw_coupon_class_dim ccd ON ccd.COUPON_CLASS = inv.EXTENDED_INFO AND inv.price_area = 'COUPON' WHERE reshdr.ship <> 'XE' AND lkparea.price_area IN ( 'SHIPROOM' ,'COUPON' )