spark.wearable.sourcequery select distinct cast(gd.src_guest_id as String) as src_guest_id,cast(gd.client_id as String) as client_id , date_format(sd.sail_date_from,'yyyy-MM-dd')  as sailstart, date_format(sd.sail_date_to,'yyyy-MM-dd')  as sailend from vv_db.hvtb_nbx_core_sw_guest_dim as gd left join vv_db.hvtb_nbx_core_sw_res_guest_rel as rgl on gd.guest_id=rgl.guest_id left join vv_db.hvtb_nbx_core_sw_reservation_dim as rd on rgl.res_id=rd.res_id left join vv_db.hvtb_nbx_core_sw_sail_dim as sd on rd.sail_id=sd.sail_id  where gd.rec_end_dttm='9999-12-31'
