
#------META DATA CONFIG-----#
spark.src.config.id SrcWearableDim
spark.voyage.id SC1912065NCM
spark.tgt.env Stage
spark.target.config.id TgtWearableDim

spark.parent.id WearableDim
spark.target.ops.table.format org.apache.phoenix.spark
spark.target.ops.table.mode overwrite
spark.target.enablerops_table HBTB_INGESTION_METADATA
spark.target.zkurl 10.3.100.222:2181/hbase-unsecure
#-------------------------#
spark.table.type dim
spark.redshift.url jdbc:jdbc:redshift://10.3.0.120:5439/devnbxpub
spark.redshift.username talenduser
spark.redshift.password Talenduser@123

spark.source.sql SELECT dp.voyage_id as voyage_id, gp.guest_wearable_id as wearable_id, gp.batchtime, gp.partdate, dp.person_skey  FROM shipdw.hvtb_parse_mxp_shore_guest_person gp LEFT OUTER JOIN shipdw.hvtb_mart_dim_person dp on (gp.person_id = dp.person_id) where dp.guest_wearable_id IS NOT NULL
spark.source.columns voyage_id,wearable_id,batchtime,partdate,person_skey
spark.pond.allColumns wearable_skey as pond_wearable_skey,voyage_id as pond_voyage_id,wearable_id as pond_wearable_id,person_skey as pond_person_skey,load_dt as pond_load_dt,upd_dt as pond_upd_dt,primaryhash as pond_primaryhash,md5_hash as pond_md5_hash

spark.surrogate_key.column wearable_skey
spark.pond.database shipdw
spark.pond.table hvtb_mart_dim_wearable

spark.source.primaryKeyColumns wearable_id,voyage_id
spark.scdtype type1
spark.frameworkEnv shore
spark.tableType DIMENSION


spark.target.final_collist wearable_skey,final_view.voyage_id,final_view.wearable_id,final_view.person_skey,load_dt,upd_dt,primaryhash,md5_hash
spark.target.temp s3://vv-staging-emr-cluster/data/temp/hvtb_mart_dim_wearable
spark.target.location s3://vv-staging-emr-cluster/data/mart/hvtb_mart_dim_wearable

spark.redshift.schema Hive_schema_stg
spark.redshift.tablename wearable_dim

