spark.guest.query select wd.addressline1 as mailing_address_line1,wd.addressline2 as mailing_address_line2 ,wd.addressline3 as mailing_address_line3, wd.city as mailing_address_city,wd.state as mailing_address_state,wd.zip as mailing_address_zip ,wd.countrycode as mailing_address_countrycode, cast(gwd.clientid as int) as mxp_client_id,cast(gwd.guestid as int) as mxp_guest_id from vv_db.hvtb_parse_mxp_shore_swtovxp_wearable as wd join  vv_db.hvtb_parse_mxp_shore_swtovxp_guest_wearable gwd  on wd.reservationid==gwd.reservationid
