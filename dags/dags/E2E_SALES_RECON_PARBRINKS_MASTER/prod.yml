
dag_config:
  dag_id: 'E2E_SALES_RECON_PARBRINKS_MASTER'
  default_args:
    'owner': 'SALESRECON'
    'email': ["DataServicesHelp@inspirebrands.com", "itdataservicessupport@inspirebrands.com"]
    'emails': ["DataServicesHelp@inspirebrands.com", "itdataservicessupport@inspirebrands.com"]
    'email_on_failure': True
    'depends_on_past': False
    'retries' : 0
  doc_md: |-
    ### Master DAG
    This DAG is responsible for triggering the other transaction DAGs for procesing data
  schedule_interval: '15 09 * * *'
  tags: ['SALESRECON_ARBYS', 'ARB', 'PARBRINKS', 'MASTERDAG']
  catchup : False
  
child_dags:
  E2E_SALES_RECON_PARBRINKS_IDS_TO_IDS_DAILY: 'E2E_SALES_RECON_PARBRINKS_IDS_TO_IDS_DAILY'
  E2E_SALES_RECON_PARBRINKS_IDS_TO_IDS_WEEKLY: 'E2E_SALES_RECON_PARBRINKS_IDS_TO_IDS_WEEKLY'
  E2E_SALES_RECON_PARBRINKS_DQ: 'E2E_SALES_RECON_PARBRINKS_DQ'