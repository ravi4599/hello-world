
dag_config:
  dag_id: 'E2E_SALES_RECON_ORACLEGL_MASTER'
  default_args:
    'owner': 'SALESRECON'
    'email': ["DataServicesHelp@inspirebrands.com", "itdataservicessupport@inspirebrands.com"]
    'emails': ["DataServicesHelp@inspirebrands.com", "itdataservicessupport@inspirebrands.com"]
    'email_on_failure': True
    'depends_on_past': False
    'retries' : 1
